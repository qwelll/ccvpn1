name: VPNNodeSelector RootHide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  THEOS: ${{ github.workspace }}/theos-roothide
  HOMEBREW_NO_AUTO_UPDATE: 1
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: Install SDK and tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          SDK_STAGE="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build RootHide package
        run: make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j3
      - uses: actions/upload-artifact@v4
        with:
          name: VPNNodeSelector-1.0.20-RootHide
          path: packages/*.deb
          if-no-files-found: error
